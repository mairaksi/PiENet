[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pienet"
version = "2.0.0"
description = "Noise-robust neural F0 (pitch) estimation for speech - PyTorch"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Manu Airaksinen", email = "manu.airaksinen@aalto.fi" },
    { name = "Lauri Juvela", email = "lauri.juvela@aalto.fi" },
]
keywords = ["pitch", "f0", "speech", "prosody", "pytorch", "audio"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "torch>=2.3",
    "numpy>=1.21",
    "scipy>=1.7",
]

[project.optional-dependencies]
audio = ["soundfile>=0.12"]          # read flac/ogg/mp3 and non-PCM wav
convert = ["tensorflow-cpu>=2.12"]   # only needed to convert TF1 checkpoints
dev = [
    "pytest>=7",
    "soundfile>=0.12",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/mairaksi/PiENet"
Paper = "https://ieeexplore.ieee.org/document/8683041"

[project.scripts]
pienet = "pienet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pienet = ["assets/*.pt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:pienet.*"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
# UP is intentionally off: the annotations keep typing.List/Optional so the
# runtime type aliases stay valid on Python 3.9.
select = ["E", "F", "W", "I", "B"]
ignore = ["B905"]
